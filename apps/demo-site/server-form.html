<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Biểu mẫu kiểm tra phía máy chủ — Kiemi Demo</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Biểu mẫu đặt hàng</h1>
      <p class="muted">
        Trình duyệt chặn mã quá 6 ký tự và email sai; máy chủ cũng phải chặn (<code>?bug=server</code> cho máy chủ bỏ qua kiểm tra).
        Có cảnh báo khi rời trang nếu đã nhập mà chưa gửi (<code>?bug=noleave</code> tắt cảnh báo).
      </p>
      <form id="order" class="card">
        <div class="field">
          <label for="code">Mã đơn *</label>
          <input id="code" name="code" type="text" required maxlength="6" placeholder="VD: DH0001" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" value="khach@example.com" />
        </div>
        <div class="field">
          <label for="note">Ghi chú</label>
          <input id="note" name="note" type="text" readonly value="Giao giờ hành chính" />
        </div>
        <button type="submit" class="btn primary" id="send">Gửi đơn</button>
      </form>
      <section class="card" aria-label="Trạng thái đơn">
        <p>Trạng thái: <strong id="order-status" data-testid="order-status">Chờ duyệt</strong></p>
        <button type="button" class="btn" id="btn-edit">Sửa</button>
        <button type="button" class="btn" id="btn-approve">Duyệt</button>
      </section>
      <p id="server-error" class="error-text" role="alert" data-testid="server-error"></p>
      <p id="server-result" role="status" data-testid="server-result"></p>
      <ul id="orders" data-testid="orders"></ul>
    </main>
    <script type="module" src="/src/server-form.ts"></script>
  </body>
</html>
